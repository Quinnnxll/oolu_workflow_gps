# Continuous integration: lint + the full test suite (browser E2E
# included), and the frontend's own tests + build-drift check. Runs on
# every push and pull request, and on demand from the Actions tab.
name: ci

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The production dialect runs in CI, not just in production: every
    # PostgreSQL-parametrized test (durable contract, marketplace boot
    # and money flow, settlement) executes against a real server here.
    # Without this service those tests skip silently — which is exactly
    # how a SQLite-only schema once reached the production gateway and
    # 502'd it at boot.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oolu
          POSTGRES_PASSWORD: oolu
          POSTGRES_DB: oolu_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U oolu -d oolu_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OOLU_TEST_PG_DSN: postgresql://oolu:oolu@127.0.0.1:5432/oolu_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install (with the extras the suite exercises)
        run: python -m pip install -e ".[serve,http,oidc,postgres,cad]" pytest "ruff==0.15.8" playwright
      - name: Install Chromium
        # The E2E smoke drives the COMMITTED shell in a real browser —
        # the anti-lie for everything unit tests fake.
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-app/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test (vitest)
        run: npx vitest run
      - name: Build the shell (typechecks first)
        run: npm run build:shell
      - name: The committed shell must match the source — no drift
        # Editing frontend source without rebuilding ships a stale app;
        # this step makes that a red build instead of a silent lie.
        run: git diff --exit-code -- ../../src/oolu/gateway/frontend/shell
